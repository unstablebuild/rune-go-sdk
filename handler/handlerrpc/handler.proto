syntax = "proto3";

option go_package = "github.com/unstablebuild/rune-go-sdk/handler/handlerrpc";

import "term/termrpc/term.proto";

package handler;

message InstallResourceResponse {
	uint64 window_id = 1;
}

message ServerMessage {
	MessageType type = 1;
	DrawStreamRequest draw = 2;
	HandleStreamRequest handle = 3;
	CloseStreamRequest close = 4;
	CursorStreamRequest cursor = 5;
	SelectionStreamRequest selection = 6;
	DimensionsStreamRequest dimensions = 7;
	ResizeStreamRequest resize = 8;

	InstallResourceResponse response = 9;
}

enum MessageType {
	Draw = 0;
	Handle = 1;
	Close = 2;
	Cursor = 3;
	Selection = 4;
	Dimensions = 5;
	Resize = 6;

	Request = 7;
	Response = 9;
}

message DrawStreamRequest {
	int32 width = 1;
	int32 height = 2;
	// packed_ok signals that the caller can decode a PackedCells frame.
	bool packed_ok = 3;
	// image_ack is the highest ImageUpload.seq read; every upload file up
	// to it may be rewritten or deleted.
	uint64 image_ack = 4;
	bool cells_unchanged_ok = 5;
}

message DrawStreamResponse {
	message Cursor {
		term.Coordinates position = 1;
		bool show = 2;
		int32 style = 3;
	}

	message Selection {
		string text = 1;
		bool ok = 2;
	}

	repeated term.CellRow rows = 1;
	Cursor cursor = 2;
	Selection selection = 3;
	// packed is set instead of rows when the request set packed_ok.
	term.PackedCells packed = 4;
	// uploads are applied before images and released.
	repeated ImageUpload uploads = 5;
	// images are drawn in order, after the cells.
	repeated ImagePlacement images = 6;
	repeated uint64 released = 7;
	// redraw asks for another draw: images places a version older than
	// the extension's.
	bool redraw = 8;
	// cells_unchanged replaces rows and packed with those of the previous
	// response; only sent if the request set cells_unchanged_ok.
	bool cells_unchanged = 9;
	// more marks a response carrying only uploads, applied with the next
	// response without it.
	bool more = 10;
}

// Graphics is sent by hosts that display images. Pixels are written to
// files in arena_dir, or streamed in ImageUpload.data when it is empty.
message Graphics {
	double cell_width = 1;
	double cell_height = 2;
	string arena_dir = 3;
	// max_bytes bounds 4*width*height of the last two uploads of every
	// image. Zero means 64 MiB.
	uint64 max_bytes = 4;
}

// ImageUpload holds width*height premultiplied RGBA pixels, with a stride
// of 4*width, in file or in the data of consecutive records with the same
// seq.
message ImageUpload {
	uint64 id = 1;
	uint64 version = 2;
	// seq increases with every upload on the stream.
	uint64 seq = 3;
	// file is "<n>-0" or "<n>-1" in Graphics.arena_dir.
	string file = 4;
	int32 width = 5;
	int32 height = 6;
	bytes data = 7;
	uint64 offset = 8;
}

enum ImageFit {
	ImageFitFill = 0;
	ImageFitContain = 1;
}

enum ImageLayer {
	ImageLayerAboveText = 0;
	ImageLayerBelowText = 1;
	ImageLayerBelowBackground = 2;
}

// ImagePlacement is a term.Image whose pixels are the last upload of id,
// shown only if it is version. crop is relative to the upload.
message ImagePlacement {
	uint64 id = 1;
	uint64 version = 2;
	term.Rect crop = 3;
	term.Coordinates pos = 4;
	term.Point offset = 5;
	term.Point raster_offset = 6;
	int32 width = 7;
	int32 height = 8;
	ImageFit fit = 9;
	ImageLayer layer = 10;
	term.Rect clip = 11;
	bool overflow = 12;
	bool vertical_render_offset = 13;
	bool negative_vertical_render_offset = 14;
}

message HandleStreamRequest {
	term.Event event = 1;
}

message HandleStreamResponse {
	bool handled = 1;
	bool quit = 2;
    term.Event request = 3;
}

message CursorStreamRequest {}

message CursorStreamResponse {
	term.Coordinates position = 1;
	bool show = 2;
	int32 style = 3;
}

message SelectionStreamRequest {}

message SelectionStreamResponse {
	string text = 1;
	bool ok = 2;
}

message DimensionsStreamRequest {}

message DimensionsStreamResponse {
	int32 width = 1;
	int32 height = 2;
}

message ResizeStreamRequest {
	int32 width = 1;
	int32 height = 2;
	Graphics graphics = 3;
}

message CloseStreamRequest {
}

message CloseStreamResponse {}
