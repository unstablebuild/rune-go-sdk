syntax = "proto3";

option go_package = "github.com/unstablebuild/rune-go-sdk/api/searchapi/searchrpc";

package search;

// Searcher searches the files of the workspace the caller is bound to.
// A search that cannot be answered fails with UNIMPLEMENTED, and one
// whose model is unknown with NOT_FOUND.
service Searcher {
  rpc RegexpSearch(RegexpRequest) returns (stream RegexpResponse);
  rpc SemanticSearch(SemanticRequest) returns (stream SemanticResponse);
}

message RegexpRequest {
  string pattern = 1;
  bool ignore_case = 2;
  repeated string roots = 3;
  repeated string include = 4;
  int32 limit = 5;
  int32 max_per_file = 6;
}

message Span {
  int32 start = 1;
  int32 end = 2;
}

// RegexpResult carries path and text as bytes: a file's name and lines
// need not be valid UTF-8, which proto strings must be.
message RegexpResult {
  bytes path = 1;
  int32 line = 2;
  bytes text = 3;
  repeated Span spans = 4;
}

message RegexpResponse {
  repeated RegexpResult results = 1;
}

message SemanticRequest {
  string query = 1;
  string model_provider = 2;
  string model_name = 3;
  repeated string roots = 4;
  int32 limit = 5;
  bool meaning = 6;
  bool prefix_last = 7;
}

message SemanticResult {
  string path = 1;
  string kind = 2;
  double score = 3;
  double z = 4;
  double cosine = 5;
  int32 keyword_rank = 6;
  string segment = 7;
  int32 loc = 8;
  int32 loc_end = 9;
  int32 focus = 10;
  string excerpt = 11;
  int64 modified = 12;
  int64 size = 13;
  string text = 14;
}

message SemanticResponse {
  SemanticResult result = 1;
}
