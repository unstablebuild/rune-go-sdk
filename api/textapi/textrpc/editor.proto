syntax = "proto3";

option go_package = "github.com/unstablebuild/rune-go-sdk/api/textapi/textrpc";

package text;

import "term/termrpc/term.proto";
import "handler/handlerrpc/handler.proto";

message URI {
	string uri = 1;
}

message EditRequest {
	URI resource_name = 1;
	repeated term.CellRow buffer = 2;
	bool read_only = 3;
	bool recovered = 4;
}

message EditResponse {
}

message EditorEvent {
  enum Type {
	TypeOpen = 0;
	TypeClose = 1;
	TypeFlush = 2;
	TypeEdit = 3;
	TypeScroll = 5;
	TypeCreate = 12;
	TypeChange = 13;
	TypeFocus = 6;
	TypeUnfocus = 7;
	TypeCursor = 8;
	TypeSelection = 9;
	TypeRename = 10;
	TypeRemove = 11;
	TypeHidden = 14;
	TypeVisible = 15;
  }

  Type type = 1;
  URI resource_name = 2;

  term.Coordinates start = 4;
  term.Coordinates end = 5;
  term.Coordinates from = 6;
  term.Coordinates to = 7;
  string content = 8;
}

message SubscribeEventRequest {
	repeated EditorEvent.Type type = 1;
	bool unsubscribe = 3;
}

message SetLocationListRequest {
	message Location {
		term.Coordinates from = 1;
		term.Coordinates to = 2;
		term.Attributes attr = 3;
		string msg = 4;
		string icon = 5;
	}
    URI resource_name = 1;
	string list_id = 2;
	repeated Location locations = 3;
	uint32 priority = 4;
}

message SetLocationListResponse {}

message EditCellRequest {
	URI resource_name = 1;
	term.Coordinates start = 2;
	term.Coordinates end = 3;
	string str = 4;
}

message EditCellResponse {
	term.Coordinates from = 1;
	term.Coordinates to = 2;
	string old = 3;
}

message RawCellsRequest {
    URI resource_name = 1;
}

message RawCellsResponse {
	repeated term.CellRow rows = 1;
}

message MoveToLocationRequest {
    URI resource_name = 1;
	string list_id = 2;
}

message MoveToLocationResponse {
}

message SetCursorRequest {
	term.Coordinates pos = 1;
    URI resource_name = 2;
}

message SetCursorResponse {
}

message CursorRequest {
    URI resource_name = 1;
}

message CursorResponse {
	term.Coordinates pos = 1;
}

message EditorRequest {
	URI resource_name = 1;
}

message EditorResponse {
}

message SetDefaultAttributesRequest {
    URI resource_name = 1;
	term.Attributes attributes = 2;
}

message SetDefaultAttributesResponse {
}

service Editor {
	rpc Edit(EditRequest) returns (EditResponse);
	rpc SetCursor(SetCursorRequest) returns (SetCursorResponse);
	rpc Cursor(CursorRequest) returns (CursorResponse);
	rpc Editor(EditorRequest) returns (EditorResponse);

	// locations
	rpc SetLocationList(SetLocationListRequest) returns (SetLocationListResponse);
	rpc MoveToNextLocation(MoveToLocationRequest) returns (MoveToLocationResponse);
	rpc MoveToPrevLocation(MoveToLocationRequest) returns (MoveToLocationResponse);


	// Editor
	rpc EditCell(EditCellRequest) returns (EditCellResponse);

	// View
	rpc RawCells(RawCellsRequest) returns (RawCellsResponse);

	rpc SetDefaultAttributes(SetDefaultAttributesRequest) returns (SetDefaultAttributesResponse);

	// streams
	rpc SubscribeEvent(stream SubscribeEventRequest) returns (stream EditorEvent);
	rpc SubscribeCommand(stream ClientCommandMessage) returns (stream ServerCommandMessage);
	rpc SubscribeREPLCommand(stream ClientREPLCommandMessage) returns (stream ServerREPLCommandMessage);
	rpc SubscribeResourceOpener(stream ClientResourceOpenerMessage) returns (stream ServerResourceOpenerMessage);
	// OpenResource serves the handler a resource opener returned for the
	// OpenResourceRequest its request names.
	rpc OpenResource(stream OpenResourceMessage) returns (stream handler.ServerMessage);
}

message SubscribeCommandRequest {
	CommandManual command = 1;
	// advertises that the extension understands
	// ServerCommandMessage.CompleteCancel; editors must not send cancels
	// to extensions that do not set it, since older SDKs terminate the
	// stream on unknown message types.
	bool supports_complete_cancel = 2;
	// advertises that the extension understands
	// ServerCommandMessage.HandleCancel and correlates handle replies by
	// request id. Same caveat as supports_complete_cancel.
	bool supports_handle_cancel = 3;
}

message CommandManual {
	string name = 1;
    string summary = 2;
    string synopsis = 3;
	repeated CommandManual commands = 4;
}

message SubscribeCommandResponse {}


message ClientCommandMessage {
	enum MessageType {
		Handle = 0;
		CompleteValue = 1;
		CompleteDone = 2;
		Request = 3;
	}
	MessageType type = 1;
	HandleCommandResponse handle = 2;
	CompleteCommandValue complete_value = 3;
	CompleteCommandDone complete_done = 4;
	SubscribeCommandRequest request = 5;
}

message ServerCommandMessage {
	enum MessageType {
		Handle = 0;
		Complete = 1;
		Response = 2;
		CompleteCancel = 3;
		HandleCancel = 4;
	}
	MessageType type = 1;
	HandleCommandRequest handle = 2;
	CompleteCommandRequest complete = 3;
	SubscribeCommandResponse response = 4;
	CompleteCommandCancel complete_cancel = 5;
	RequestCancel handle_cancel = 6;
}

message HandleCommandRequest {
	string name = 1;
	repeated string args = 2;
	URI resource_name = 3;
	term.Coordinates cursor_content = 4;
	term.Coordinates cursor_window = 5;
	uint64 window_id = 6;
	// zero when the editor predates request ids, in which case replies
	// keep their historical arrival-order meaning.
	int64 id = 7;
}

message HandleCommandResponse {
	string error = 1;
	int64 id = 2;
}

message CompleteCommandRequest {
	int64 id = 1;
	string name = 2;
	repeated string args = 3;
}

message CompleteCommandValue {
	int64 id = 1;
	string value = 2;
}

message CompleteCommandDone {
	int64 id = 1;
	string error = 2;
}

message CompleteCommandCancel {
	int64 id = 1;
}

// RequestCancel asks the extension to abandon an in-flight request by
// cancelling the context its handler was invoked with.
message RequestCancel {
	int64 id = 1;
}

// REPL command streaming

message SubscribeREPLCommandRequest {
	CommandManual command = 1;
	bool supports_complete_cancel = 2;
	bool supports_handle_cancel = 3;
}

message SubscribeREPLCommandResponse {}

message ClientREPLCommandMessage {
	enum MessageType {
		HandleValue = 0;
		HandleDone = 1;
		CompleteValue = 2;
		CompleteDone = 3;
		HelpValue = 4;
		HelpDone = 5;
		Request = 6;
		HandleProgress = 7;
	}
	MessageType type = 1;
	HandleREPLCommandValue handle_value = 2;
	HandleREPLCommandDone handle_done = 3;
	CompleteCommandValue complete_value = 4;
	CompleteCommandDone complete_done = 5;
	HelpCommandValue help_value = 6;
	HelpCommandDone help_done = 7;
	SubscribeREPLCommandRequest request = 8;
	HandleREPLCommandProgress handle_progress = 9;
}

message ServerREPLCommandMessage {
	enum MessageType {
		Handle = 0;
		Complete = 1;
		Help = 2;
		Response = 3;
		CompleteCancel = 4;
		HandleCancel = 5;
		HelpCancel = 6;
	}
	MessageType type = 1;
	HandleREPLCommandRequest handle = 2;
	CompleteCommandRequest complete = 3;
	HelpCommandRequest help = 4;
	SubscribeREPLCommandResponse response = 5;
	CompleteCommandCancel complete_cancel = 6;
	RequestCancel handle_cancel = 7;
	RequestCancel help_cancel = 8;
}

message HandleREPLCommandRequest {
	string name = 1;
	repeated string args = 2;
	int32 width = 3;
	// tags every message of this command's response stream. Zero when
	// the editor predates request ids, in which case the extension
	// replies with a zero id too.
	int64 id = 4;
}

message HandleREPLCommandValue {
	repeated term.CellRow rows = 1;
	int64 id = 2;
}

message HandleREPLCommandDone {
	string error = 1;
	int64 id = 2;
}

message HandleREPLCommandProgress {
	int64 progress = 1;
	int64 total = 2;
	string units = 3;
	int64 id = 4;
}

message HelpCommandRequest {
	repeated string args = 1;
	int32 width = 2;
	int64 id = 3;
}

message HelpCommandValue {
	repeated term.CellRow rows = 1;
	int64 id = 2;
}

message HelpCommandDone {
	string error = 1;
	int64 id = 2;
}

// Resource opener streaming

message SubscribeResourceOpenerRequest {
	string scheme = 1;
}

message SubscribeResourceOpenerResponse {}

message OpenResourceRequest {
	reserved 3;
	int64 id = 1;
	URI uri = 2;
}

// OpenResourceResponse reports that the opener failed the OpenResourceRequest
// with the given id. A successful open is reported by the handler stream
// (Editor.OpenResource) instead.
message OpenResourceResponse {
	int64 id = 1;
	string error = 2;
}
message OpenResourceStreamRequest {
	// id is the OpenResourceRequest this handler answers.
	int64 id = 1;
}
message OpenResourceMessage {
	handler.MessageType type = 1;
	handler.DrawStreamResponse draw = 2;
	handler.HandleStreamResponse handle = 3;
	handler.CloseStreamResponse close = 5;
	handler.CursorStreamResponse cursor = 6;
	handler.SelectionStreamResponse selection = 7;
	handler.DimensionsStreamResponse dimensions = 8;

	OpenResourceStreamRequest request = 10;
}

message ClientResourceOpenerMessage {
	enum MessageType {
		Request = 0;
		Open = 1;
	}
	MessageType type = 1;
	SubscribeResourceOpenerRequest request = 2;
	OpenResourceResponse open = 3;
}

message ServerResourceOpenerMessage {
	enum MessageType {
		Response = 0;
		Open = 1;
		OpenCancel = 2;
	}
	MessageType type = 1;
	SubscribeResourceOpenerResponse response = 2;
	OpenResourceRequest open = 3;
	RequestCancel open_cancel = 4;
}
